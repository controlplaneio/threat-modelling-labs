apiVersion: v1
kind: Pod
metadata:
  name: hello-go-allowed
  labels:
    bats: test
spec:
  containers:
  - name: hello-go
    image: #paste your image here 
    ports:
    - containerPort: 80
    securityContext:
      privileged: false
      capabilities:
        drop:
          - ALL
    imagePullPolicy: Always